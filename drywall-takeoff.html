/* ── Storage abstraction — Firebase when available, window.storage fallback ── */
let useFirebase = false;

async function storageSet(key, value) {
  if (useFirebase && fbUser) {
    return db.collection('users').doc(fbUser.uid).collection('data').doc(key)
      .set({ json: JSON.stringify(value), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  }
  try { await window.storage.set('drywall-' + key, JSON.stringify(value)); } catch(e) {}
}

async function storageGet(key) {
  if (useFirebase && fbUser) {
    const doc = await db.collection('users').doc(fbUser.uid).collection('data').doc(key).get();
    return (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : null;
  }
  try {
    const r = await window.storage.get('drywall-' + key);
    return r ? JSON.parse(r.value) : null;
  } catch(e) { return null; }
}

/* ── Fallback: run app without Firebase ── */
async function initFallback() {
  useFirebase = false;
  // Hide auth screen, show app, load from window.storage
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  // Update drawer to show "Local Mode"

  if (soBtn) soBtn.style.display = 'none';
  await loadUserData();
}

/* ── Load Firebase SDKs dynamically, then init auth ── */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initFirebase() {
  try {
    await Promise.all([
      loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js'),
      loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js'),
      loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js'),
    ]);
    // SDKs loaded — init Firebase
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    useFirebase = true;

    // Keep user signed in across page refreshes
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {});

  // Show "Restoring session…" while Firebase checks saved login
  const authScreen = document.getElementById('auth-screen');
  const signInBtn = authScreen.querySelector('.google-sign-in-btn');
  const authSub = authScreen.querySelector('.auth-sub');
  authScreen.style.display = 'flex';
  signInBtn.style.display = 'none';
  authSub.textContent = 'Restoring session…';

  let authInitialized = false;
  firebase.auth().onAuthStateChanged(async user => {
    signInBtn.style.display = '';
    authSub.textContent = 'Sign in to sync your jobs across all your devices.';
    if (user) {
      authInitialized = true;
      fbUser = user;
      const name = user.displayName || user.email || '?';
      document.getElementById('drawer-user-name').textContent = name;
      document.getElementById('drawer-user-email').textContent = user.email;
      const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('drawer-user-initials').textContent = initials;
      const photo = document.getElementById('drawer-user-photo');
      if (user.photoURL) {
        photo.src = user.photoURL;
        photo.style.display = 'block';
        document.getElementById('drawer-user-initials').style.display = 'none';
      } else {
        photo.style.display = 'none';
        document.getElementById('drawer-user-initials').style.display = '';
      }
      showAppScreen();
      await loadUserData();
    } else {
      fbUser = null;
      // Only clear state and show auth screen if this is NOT the initial load
      // (Firebase fires null briefly on refresh before restoring the session)
      if (authInitialized) {
        clearLocalState();
        showAuthScreen();
      } else {
        // First auth check — wait 2s for session restore before giving up
        setTimeout(() => {
          if (!fbUser) {
            clearLocalState();
            showAuthScreen();
          }
        }, 2000);
        authInitialized = true;
      }
    }
  });
  } catch(e) {
    // Firebase blocked (e.g. claude.ai sandbox) — fall back silently
    console.log('Firebase unavailable, using local storage.');
    initFallback();
  }
}

function init() {
  // Show a brief loading state then attempt Firebase
  initFirebase();
}
init();
