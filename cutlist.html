const { C, money, sectionLabel, Btn, TextInput, NumInput, Field, Empty, Modal, Icon } = window;
const { optimizeStock, packSheets, PEGBOARD_H, DEPTH } = window;

function skuKey(name) {
  if (name.includes("¾")) return "ply075";
  if (name.includes("½")) return "ply05";
  if (name.includes("Pegboard")) return "peg";
  const m = name.match(/(\d+')/); return m ? m[1] : "";
}

function buildMaterials(unitsList, priceMap, consumables) {
  const pooledFraming = unitsList.flatMap((u) => u.framing);
  const studs = pooledFraming.length ? optimizeStock(pooledFraming).byLength : {};
  const peg = packSheets(unitsList.flatMap((u) => u.pegPieces || []), PEGBOARD_H);
  const p05 = packSheets(unitsList.filter((u) => u.ply === 0.5).flatMap((u) => u.plyPieces || []), DEPTH);
  const p075 = packSheets(unitsList.filter((u) => u.ply === 0.75).flatMap((u) => u.plyPieces || []), DEPTH);
  const lines = []; let cost = 0;
  ["8'", "10'", "12'", "16'"].forEach((k) => { if (studs[k]) { lines.push({ name: `2×4 × ${k}`, qty: studs[k], each: priceMap[k] || 0 }); cost += studs[k] * (priceMap[k] || 0); } });
  if (p075 && p075.sheets) { lines.push({ name: '¾" Plywood 4×8', qty: p075.sheets, each: priceMap.ply075 || 0 }); cost += p075.sheets * (priceMap.ply075 || 0); }
  if (p05 && p05.sheets) { lines.push({ name: '½" Plywood 4×8', qty: p05.sheets, each: priceMap.ply05 || 0 }); cost += p05.sheets * (priceMap.ply05 || 0); }
  if (peg && peg.sheets) { lines.push({ name: "Pegboard 4×8", qty: peg.sheets, each: priceMap.peg || 0 }); cost += peg.sheets * (priceMap.peg || 0); }
  const cons = [];
  consumables.forEach((c) => {
    let use = 0;
    unitsList.forEach((u) => { use += window.consumableQtyFor ? window.consumableQtyFor(c, u) : 0; });
    if (use > 0.001) {

      const each = c.buyPrice / (c.buyQty || 1);
      cons.push({ id: c.id, name: c.name, qty: rounded, unitName: c.unitName, each });
      cost += each * use;
    }
  });
  return { lines, cons, cost };
}

const fmtDur = (ms) => { if (!ms || ms < 0) return "0:00"; const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return m + ":" + String(s % 60).padStart(2, "0"); };

  const [receipt, setReceipt] = React.useState(null);
  const [date, setDate] = React.useState(new Date().toISOString().slice(0, 10));

  const setPaid = (i, v) => setLines((p) => p.map((l, j) => j === i ? { ...l, paid: v } : l));
  const upload = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => setReceipt(r.result); r.readAsDataURL(f); };

  const submit = () => {
    store.purchaseForShelves(chosen.map((u) => u.id), {
      date: new Date(date).getTime(), tripMs, total, receipt,
      lines: lines.map((l) => ({ label: l.label, paid: +l.paid || 0 })),
      restock: mat.cons.map((c) => ({ id: c.id, qty: c.qty })),
      restockStock: mat.lines.map((l) => ({ sku: skuKey(l.name), qty: l.qty })),
    });

  return (
    <Modal title={`Record Purchase · ${chosen.length} shelf${chosen.length > 1 ? "s" : ""}`} onClose={onClose} wide>
      <div style={{ marginBottom: "14px" }}>

            <span style={{ color: C.text, fontSize: "13px" }}>{l.label}</span>

          : <label style={{ display: "inline-flex", alignItems: "center", gap: "8px", padding: "10px 14px", background: C.card, border: `1px dashed ${C.border}`, borderRadius: "7px", cursor: "pointer", color: C.muted, fontSize: "13px" }}>📷 Attach receipt<input type="file" accept="image/*" onChange={upload} style={{ display: "none" }} /></label>}

function ShoppingTab() {
  const store = window.useStore();
  const { units, shopping, setShopping, priceMap, consumables, addToShopping, STAGES } = store;
  const shelves = units.filter((u) => u.stage === STAGES.SHOPPING || u.stage === STAGES.BUILD);
  const [sel, setSel] = React.useState({});
  const [checked, setChecked] = React.useState({});
  const [name, setName] = React.useState("");
  const [modal, setModal] = React.useState(false);
  // trip timer
  const [running, setRunning] = React.useState(false);
  const [accum, setAccum] = React.useState(0);
  const [startedAt, setStartedAt] = React.useState(0);
  const [now, setNow] = React.useState(Date.now());

        <TextInput value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addManual()} placeholder="Add an item… (sandpaper, drill bits)" />

        return (

          </div>);
      })}
    </div>
  );
}

window.ShoppingTab = ShoppingTab;
})();

  { id: "cutlist", label: "Cut-List", el: "CutListTab", icon: "cutlist" },
  { id: "ship", label: "Shipping", el: "ShipTab", icon: "ship" },
  { id: "invoices", label: "Invoices", el: "InvoicesTab", icon: "invoices" },
  { id: "sold", label: "Sold", el: "SoldTab", icon: "sold" },
  { id: "cost", label: "Cost", el: "CostTab", icon: "cost" },
  { id: "settings", label: "Settings", el: "SettingsTab", icon: "settings" },
];

function CloudDot() {
  const { settings } = useStore();
  if (!settings.firebaseEnabled) return null;
  return <span title="Cloud backup on" style={{ display: "inline-block", width: "7px", height: "7px", borderRadius: "50%", background: C.green, marginLeft: "8px", verticalAlign: "middle" }} />;
}

function Shell() {
  const store = useStore();
  const { units, deliveries, STAGES } = store;
  const [tab, setTab] = React.useState(() => localStorage.getItem("pgs_tab") || "dashboard");
  const [printNode, setPrintNode] = React.useState(null);

  React.useEffect(() => { window.openPrint = (node, opts) => setPrintNode({ node, opts }); return () => { window.openPrint = null; }; }, []);
  React.useEffect(() => { localStorage.setItem("pgs_tab", tab); }, [tab]);

  const counts = {
    shopping: units.filter((u) => u.stage === STAGES.SHOPPING || u.stage === STAGES.BUILD).length,
    cutlist: units.filter((u) => u.stage === STAGES.ACTIVE).length,
    ship: units.filter((u) => u.stage === STAGES.COMPLETE && !u.deliveryId).length,
    invoices: deliveries.filter((d) => d.arrivedAt && !d.invoiced).length,
  };
  const ActiveTab = window[(TABS.find((t) => t.id === tab) || TABS[0]).el];

  return (
    <div style={{ background: C.bg, color: C.text, minHeight: "100vh", fontFamily: "'Helvetica Neue', system-ui, sans-serif" }}>
      <div style={{ borderBottom: `1px solid ${C.line}`, padding: "16px 20px 13px", display: "flex", alignItems: "baseline", gap: "12px", flexWrap: "wrap", position: "sticky", top: 0, background: C.bg, zIndex: 20 }}>
        <h1 style={{ margin: 0, fontSize: "17px", fontWeight: 800, color: C.text, letterSpacing: ".5px" }}>PEAK GARAGE <span style={{ color: C.bright }}>SOLUTIONS</span></h1>
        <span style={{ color: C.dim, fontSize: "11px", letterSpacing: "2px" }}>{(TABS.find((t) => t.id === tab) || TABS[0]).label.toUpperCase()}<CloudDot /></span>
      </div>

      <div style={{ padding: "22px 20px 96px", maxWidth: "920px", margin: "0 auto" }}>
        <ActiveTab />
      </div>

      {/* bottom icon nav */}
      <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 30, background: "rgba(16,16,18,.96)", backdropFilter: "blur(12px)", borderTop: `1px solid ${C.border}`, display: "flex", overflowX: "auto", padding: "6px 4px calc(6px + env(safe-area-inset-bottom))", gap: "2px" }}>
        {TABS.map((t) => {
          const on = tab === t.id; const n = counts[t.id];
          return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              flex: "1 0 auto", minWidth: "60px", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit",
              display: "flex", flexDirection: "column", alignItems: "center", gap: "3px", padding: "6px 6px 4px", position: "relative",
            }}>
              <div style={{ position: "relative" }}>
                <Icon name={t.icon} size={21} color={on ? C.bright : C.muted} />
                {n ? <span style={{ position: "absolute", top: "-5px", right: "-9px", fontSize: "9px", fontWeight: 800, minWidth: "15px", height: "15px", padding: "0 3px", borderRadius: "8px", background: C.bright, color: "#0e0e0f", display: "flex", alignItems: "center", justifyContent: "center", border: `1.5px solid ${C.bg}` }}>{n}</span> : null}
              </div>
              <span style={{ fontSize: "10px", fontWeight: on ? 800 : 600, color: on ? C.bright : C.muted, whiteSpace: "nowrap", letterSpacing: ".2px" }}>{t.label}</span>
            </button>);
        })}
      </div>

      {printNode && <window.PrintOverlay print={printNode} onClose={() => setPrintNode(null)} />}
    </div>
  );
}

function App() { return React.createElement(StoreProvider, null, React.createElement(Shell)); }

/* error boundary so a tab error shows a message + Reset, never a black screen */
class ErrBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  componentDidCatch(err) { this.setState({ err }); }
  render() {
    if (!this.state.err) return this.props.children;
    return React.createElement("div", { style: { background: C.bg, color: C.text, minHeight: "100vh", padding: "40px 22px", fontFamily: "system-ui, sans-serif" } },
      React.createElement("h2", { style: { color: C.bright, fontSize: "18px" } }, "Something hit a snag"),
      React.createElement("p", { style: { color: C.muted, fontSize: "14px", maxWidth: "520px", lineHeight: 1.6 } }, "The app loaded but a screen errored. Your data is safe. Try reloading, or reset the view (this only clears which tab is open, not your data)."),
      React.createElement("pre", { style: { color: C.dim, fontSize: "11px", whiteSpace: "pre-wrap", background: C.card, padding: "12px", borderRadius: "8px", overflow: "auto" } }, String(this.state.err && this.state.err.stack || this.state.err)),
      React.createElement("button", { onClick: () => { try { localStorage.removeItem("pgs_tab"); } catch (e) {} location.reload(); }, style: { marginTop: "14px", background: C.bright, color: "#0e0e0f", border: "none", borderRadius: "7px", padding: "12px 20px", fontSize: "14px", fontWeight: 800, cursor: "pointer" } }, "Reset & Reload"));
  }
}

(function boot() {
  /* surface any fatal error on-screen instead of a blank page */
  function fatal(msg) {
    var r = document.getElementById("root");
    if (r) r.innerHTML = '<div style="color:#ededed;background:#0e0e0f;min-height:100vh;padding:40px 22px;font-family:system-ui,sans-serif"><h2 style="color:#F5821F">Couldn\u2019t start</h2><p style="color:#8c8c92;max-width:520px;line-height:1.6">A required file didn\u2019t load. If you\u2019re online and still see this, it\u2019s usually a network/CDN block. Pull to refresh, or try again on Wi-Fi.</p><pre style="color:#5b5b62;font-size:11px;white-space:pre-wrap">' + String(msg).replace(/</g, "&lt;") + "</pre></div>";
  }
  window.addEventListener("error", function (e) {
    if (!window.__pgsBooted && e && (e.message || e.error)) fatal(e.message || e.error);
  });
  if (!window.React || !window.ReactDOM || !window.Babel) { fatal("React/Babel CDN did not load."); return; }
  try {
    const settings = window.loadLS("pgs_settings", null);
    if (settings && settings.firebaseEnabled && settings.firebase) window.pgsCloudInit(settings.firebase);
  } catch (e) {}
  window.pgsBackupNow = function () {
    Object.values(window.LS_KEYS).forEach((k) => { const v = window.loadLS(k, null); if (v != null) window.pgsCloudPush(k, v); });
  };
  window.__pgsBooted = true;
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrBoundary, null, React.createElement(App)));
})();
})();

</script>
</body>
</html>
