<script>

const EMAILJS_PUBLIC_KEY  = 'oNs9CbcPHf_Nhc4kH';
const EMAILJS_SERVICE_ID  = 'service_4qiybvi';
const EMAILJS_TEMPLATE_ID = 'template_ayvgsvb';
const EMAILJS_TEMPLATE_ID2 = 'template_w5deyiz';
// ============================================================

// ── REAL DIMENSION LOOKUP TABLES ──
const WIDTH_IN  = {1:23.5, 2:45.5, 3:67.5, 4:89.5, 5:111.5, 6:133.5};
const HEIGHT_IN = {2:36,   3:52,   4:68,   5:84,   6:100};
const CASTER_ADD = 4;

// ── CANVAS SCALE ──
const MAX_W_IN = 133.5, MAX_H_IN = 100;
const CVS_W = 260, CVS_H = 210, PAD = 18;
const SCALE_X = (CVS_W - PAD*2) / MAX_W_IN;
const SCALE_Y = (CVS_H - PAD*2) / MAX_H_IN;

// ── PRICING RULES ──
function stainCost(c,r)     { const s=c*r; return s<=8 ? 50 : s<=16 ? 75 : s<=24 ? 100 : 150; }
function topCost(c)         { return c*25; }
function basicTopCost(c)    { return c*10; }
function casterCost(c,r)    { const s=c*r; return s<12 ? 50 : s<16 ? 75 : 100; }
function casterCount(c,r)   { const s=c*r; return s<12 ? 4 : s<16 ? 6 : 8; }

// ── CANVAS HELPER (Safari/iOS Fix) ──
function drawRoundRect(ctx, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ── STATE ──
const S = {cols:3, rows:2, addons:new Set(), stainColor:'black', doubleUnit:false};

function setSel(btn, key, val) {
  if (S.doubleUnit) return;
  S[key] = val;
  btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  update();
}

function toggleDoubleUnit(btn, type) {
  const turningOff = (S.doubleUnit === type);
  S.doubleUnit = turningOff ? false : type;

  document.getElementById('double-unit-btn').classList.toggle('sel', S.doubleUnit === '4high');
  document.getElementById('double-unit-3h-btn').classList.toggle('sel', S.doubleUnit === '3high');
  document.getElementById('double-unit-2h-btn').classList.toggle('sel', S.doubleUnit === '2high');

  const isDU = !!S.doubleUnit;
  const colRow = document.getElementById('cols-row');
  colRow.querySelectorAll('.opt-btn:not(.opt-btn-du)').forEach(b => {
    if (isDU) b.classList.remove('sel');
    b.style.opacity = isDU ? '.35' : '';
    b.style.pointerEvents = isDU ? 'none' : '';
  });
  const rowRow = document.getElementById('rows-row');
  rowRow.querySelectorAll('.opt-btn').forEach(b => {
    b.style.opacity = isDU ? '.35' : '';
    b.style.pointerEvents = isDU ? 'none' : '';
  });

  const basictopCard = document.querySelector('.addon-card[data-key="basictop"]');
  const topCard      = document.querySelector('.addon-card[data-key="top"]');

  if (isDU) {
    basictopCard.classList.remove('disabled');
    topCard.classList.remove('disabled');
    S.addons.delete('basictop');
    basictopCard.classList.remove('on');
    S.addons.add('top');
    topCard.classList.add('on');
  } else {
    S.addons.delete('top');
    S.addons.delete('basictop');
    topCard.classList.remove('on');
    basictopCard.classList.remove('on');
    colRow.querySelectorAll('.opt-btn:not(.opt-btn-du)').forEach(b => {
      if (parseInt(b.textContent) === S.cols) b.classList.add('sel');
    });
  }
  update();
}

function setStainColor(val) {
  S.stainColor = val;
  update();
}

function toggleAddon(card, key) {
  if (!!S.doubleUnit && (key === 'top' || key === 'basictop')) {
    if (S.addons.has(key)) return;
    const other = key === 'top' ? 'basictop' : 'top';
    S.addons.delete(other);
    document.querySelectorAll('.addon-card').forEach(c => { if(c.dataset.key===other) c.classList.remove('on'); });
    S.addons.add(key);
    card.classList.add('on');
    
    // Fix: Immediately remove stain if switching to Basic Plywood
    if (key === 'basictop') {
        S.addons.delete('stain');
        document.querySelectorAll('.addon-card').forEach(c => { if(c.dataset.key==='stain') c.classList.remove('on'); });
    }
    update();
    return;
  }
  
  if (key==='top' || key==='basictop') {
    const other = key==='top' ? 'basictop' : 'top';
    S.addons.delete(other);
    document.querySelectorAll('.addon-card').forEach(c => { if(c.dataset.key===other) c.classList.remove('on'); });
  }
  if (key==='basictop' && !S.addons.has('basictop')) {
    S.addons.delete('stain');
    document.querySelectorAll('.addon-card').forEach(c => { if(c.dataset.key==='stain') c.classList.remove('on'); });
  }
  
  if (S.addons.has(key)) { S.addons.delete(key); card.classList.remove('on'); }
  else                   { S.addons.add(key);    card.classList.add('on'); }
  update();
}

// ── CENTRALIZED DOUBLE UNIT LOGIC (DRY Principle) ──
function getDoubleUnitConfig() {
  const is4h = S.doubleUnit === '4high';
  const is3h = S.doubleUnit === '3high';
  const duLabel = is4h ? '4' : is3h ? '3' : '2';
  const duSlots = is4h ? 16 : is3h ? 12 : 8;
  const duRows  = is4h ? 4 : is3h ? 3 : 2;
  const hasBasic = S.addons.has('basictop');
  const hasMaple = S.addons.has('top');
  const hasCasters = S.addons.has('casters');
  const hasTotes = S.addons.has('totes');
  const hasStain = S.addons.has('stain') && !hasBasic;

  const hInBase = is4h ? 68.75 : is3h ? 52.75 : 36.75;
  const hIn = hasBasic ? hInBase - 0.25 : hInBase;
  const hInFinal = hasCasters ? hIn + CASTER_ADD : hIn;
  const wIn = 133.5;

  const duBase = is4h ? (hasBasic ? 530 : 600) : is3h ? (hasBasic ? 435 : 500) : (hasBasic ? 340 : 400);
  const topLabel = hasBasic ? '1/2" Basic Plywood Top (included)' : '3/4" Sanded Maple Top (included)';
  const topName = hasBasic ? '1/2" Basic Plywood Top' : '3/4" Sanded Maple Top';
  const basicSave = is4h ? 70 : is3h ? 65 : 60;

  const duCasterCount = casterCount(4, duRows);
  const duCasterCost = casterCost(4, duRows);
  const duStainCost = is4h ? 100 : is3h ? 85 : 75;

  let total = duBase;
  const lines = [{ label: duLabel + ' High Double Unit (' + topLabel + ')', val: duBase }];
  const names = [topName];

  if (hasStain) {
    total += duStainCost;
    lines.push({label:'Stain ('+S.stainColor.charAt(0).toUpperCase()+S.stainColor.slice(1)+')', val:duStainCost});
    names.push('Stain');
  }
  if (hasCasters) {
    total += duCasterCost;
    lines.push({label:'Casters ('+duCasterCount+' wheels)', val:duCasterCost});
    names.push('Casters');
  }
  if (hasTotes) {
    total += duSlots*15;
    lines.push({label:duSlots+' totes × $15', val:duSlots*15});
    names.push('Storage Totes ('+duSlots+')');
  }

  const summary = duLabel+' High Double Unit (2+Shelf+2) · '+duSlots+' tote slots · 133.5" wide × '+hInFinal+'" tall × 28.5" deep'
    +(names.length > 1 ? ' · Add-ons: '+names.slice(1).join(', ') : '')
    +' · Total: $'+total+' CAD';

  return {
    duLabel, duSlots, duRows, hasBasic, hasMaple, hasCasters, hasTotes, hasStain,
    hIn, hInFinal, wIn, duBase, topLabel, topName, basicSave,
    duCasterCount, duCasterCost, duStainCost,
    total, lines, names, summary
  };
}

function calcPrice() {
  const {cols,rows,addons,stainColor} = S;
  const slots = cols*rows, base = slots*22;
  const lines = [{label:slots+' slots × $22', val:base}];
  let total = base;
  if(addons.has('basictop'))   { const p=basicTopCost(cols);    total+=p; lines.push({label:'1/2" Basic plywood top',val:p}); }
  if(addons.has('top'))        { const p=topCost(cols);         total+=p; lines.push({label:'3/4" Maple plywood top',val:p}); }
  if(addons.has('stain'))      { const p=stainCost(cols,rows);  total+=p; lines.push({label:'Stain ('+stainColor.charAt(0).toUpperCase()+stainColor.slice(1)+')',val:p}); }
  if(addons.has('casters'))    { const p=casterCost(cols,rows); total+=p; lines.push({label:'Casters ('+casterCount(cols,rows)+' wheels)',val:p}); }
  if(addons.has('totes'))      { const p=slots*15;              total+=p; lines.push({label:slots+' totes × $15',val:p}); }
  return {total, lines};
}

function getAddonNames() {
  const {addons,cols,rows,stainColor} = S;
  const n = [];
  if(addons.has('basictop'))   n.push('1/2" Basic Plywood Top');
  if(addons.has('top'))        n.push('3/4" Sanded Maple Top');
  if(addons.has('stain'))      n.push('Stain ('+stainColor.charAt(0).toUpperCase()+stainColor.slice(1)+')');
  if(addons.has('casters'))    n.push('Casters ('+casterCount(cols,rows)+' wheels)');
  if(addons.has('totes'))      n.push('Storage Totes ('+cols*rows+')');
  return n;
}

function update() {
  if (S.doubleUnit) {
    const cfg = getDoubleUnitConfig();

    document.getElementById('lbl-basictop').textContent = cfg.hasBasic ? 'Included in base price ($'+cfg.duBase+')' : 'Switch — saves $'+cfg.basicSave;
    document.getElementById('lbl-top').textContent = cfg.hasMaple ? 'Included in base price ($'+cfg.duBase+')' : 'Switch — adds $'+cfg.basicSave;
    document.getElementById('lbl-stain').textContent = '$'+cfg.duStainCost;
    document.getElementById('lbl-casters').textContent = '$'+cfg.duCasterCost+' · '+cfg.duCasterCount+' wheels';
    document.getElementById('lbl-totes').textContent = '$15 × '+cfg.duSlots+' = $'+(cfg.duSlots*15);

    const stainCard = document.getElementById('card-stain');
    if (cfg.hasBasic) {
      stainCard.classList.add('disabled');
      S.addons.delete('stain');
      stainCard.classList.remove('on');
    } else {
      stainCard.classList.remove('disabled');
    }
    document.getElementById('stain-color-wrap').style.display = cfg.hasStain ? 'block' : 'none';

    document.getElementById('p-amt').textContent = '$'+cfg.total;
    document.getElementById('p-break').innerHTML =
      cfg.lines.map(l=>`<div class="line"><span>${l.label}</span><span>$${l.val}</span></div>`).join('')+
      `<div class="line" style="border-top:1px solid rgba(201,168,76,.25);margin-top:.4rem;padding-top:.4rem;color:var(--gold-light)"><span>Total</span><span>$${cfg.total}</span></div>`;

    document.getElementById('pvLabel').innerHTML =
      cfg.duLabel+' High Double Unit: 2+Shelf+2 &nbsp;·&nbsp; '+cfg.duSlots+' slots<br>133.5" W &nbsp;×&nbsp; '+cfg.hInFinal+'" H &nbsp;×&nbsp; 28.5" D';

    drawPreviewDU();
    return;
  }

  const {cols,rows} = S;
  const slots = cols*rows;
  const wIn = WIDTH_IN[cols], hIn = HEIGHT_IN[rows];
  const topThick  = S.addons.has('basictop') ? 0.5 : S.addons.has('top') ? 0.75 : 0;
  const hasCasters = S.addons.has('casters');
  const hInTotal  = hIn + topThick + (hasCasters ? CASTER_ADD : 0);

  document.getElementById('lbl-basictop').textContent   = '$'+basicTopCost(cols)+' ($10 × '+cols+' wide)';
  document.getElementById('lbl-top').textContent        = '$'+topCost(cols)+' ($25 × '+cols+' wide)';
  document.getElementById('lbl-stain').textContent      = '$'+stainCost(cols,rows);
  document.getElementById('lbl-casters').textContent    = '$'+casterCost(cols,rows)+' · '+casterCount(cols,rows)+' wheels';
  document.getElementById('lbl-totes').textContent      = '$15 × '+slots+' = $'+(slots*15);

  const basicOn = S.addons.has('basictop');
  const stainCard = document.getElementById('card-stain');
  if (basicOn) {
    stainCard.classList.add('disabled');
  } else {
    stainCard.classList.remove('disabled');
  }

  const stainOn = S.addons.has('stain') && !basicOn;
  document.getElementById('stain-color-wrap').style.display = stainOn ? 'block' : 'none';

  const {total,lines} = calcPrice();
  document.getElementById('p-amt').textContent = '$'+total;
  document.getElementById('p-break').innerHTML =
    lines.map(l=>`<div class="line"><span>${l.label}</span><span>$${l.val}</span></div>`).join('')+
    `<div class="line" style="border-top:1px solid rgba(201,168,76,.25);margin-top:.4rem;padding-top:.4rem;color:var(--gold-light)"><span>Total</span><span>$${total}</span></div>`;

  document.getElementById('pvLabel').innerHTML =
    cols+' wide × '+rows+' high &nbsp;·&nbsp; '+slots+' slots<br>'+
    wIn+'" W &nbsp;×&nbsp; '+hInTotal+'" H &nbsp;×&nbsp; 28.5" D';

  drawPreview();
}

// ── MODAL ──
function openModal() {
  let summary;
  if (S.doubleUnit) {
    summary = getDoubleUnitConfig().summary;
  } else {
    const {cols,rows} = S;
    const slots = cols*rows;
    const wIn = WIDTH_IN[cols], hIn = HEIGHT_IN[rows];
    const names = getAddonNames();
    const {total} = calcPrice();
    summary = cols+'W × '+rows+'H · '+slots+' tote slots · '+wIn+'" wide × '+hIn+'" tall × 28.5" deep'
      +(names.length?' · Add-ons: '+names.join(', '):'')
      +' · Total: $'+total+' CAD';
  }
  document.getElementById('modal-config-text').textContent = summary;
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('statusMsg').className = 'status-msg';
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('sendBtn').textContent = 'Send Quote Request';
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

function handleBackdropClick(e) {
  if (e.target === document.getElementById('modalBackdrop')) closeModal();
}

function submitQuote() {
  const name  = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const status = document.getElementById('statusMsg');

  if (!name) {
    status.className = 'status-msg error';
    status.textContent = 'Please enter your name.';
    return;
  }
  if (!phone && !email) {
    showAlert('Please provide at least a phone number or email address so we can reach you.');
    return;
  }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showAlert('Please enter a valid email address.');
    return;
  }

  let summary, cols, rows, slots, wIn, hIn, names_arr, total_val;
  if (S.doubleUnit) {
    const cfg = getDoubleUnitConfig();
    summary = cfg.summary;
    cols = 'Double(2+S+2,'+cfg.duLabel+'H)';
    rows = cfg.duRows+' high';
    slots = cfg.duSlots;
    wIn = cfg.wIn+'"';
    hIn = cfg.hInFinal+'"';
    names_arr = cfg.names;
    total_val = '$'+cfg.total;
  } else {
    cols = S.cols; rows = S.rows;
    slots = cols*rows;
    wIn = WIDTH_IN[cols]+'"'; hIn = HEIGHT_IN[rows]+'"';
    names_arr = getAddonNames();
    const {total} = calcPrice();
    total_val = '$'+total;
    summary = cols+'W × '+rows+'H · '+slots+' tote slots · '+wIn+' wide × '+hIn+' tall × 28.5" deep'
      +(names_arr.length?' · Add-ons: '+names_arr.join(', '):'')
      +' · Total: '+total_val+' CAD';
  }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  status.className = 'status-msg';

  emailjs.init(EMAILJS_PUBLIC_KEY);

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID2, {
      to_email:       'benny@peakgaragesolutions.ca',
      from_name:      name,
      from_email:     email || '(not provided)',
      phone:          phone || '(not provided)',
      config_cols:    cols + ' wide',
      config_rows:    rows + ' high',
      config_slots:   slots + ' tote slots',
      config_width:   wIn,
      config_height:  hIn,
      config_depth:   '28.5"',
      config_addons:  names_arr.length ? names_arr.join(', ') : 'None',
      config_total:   total_val + ' CAD',
      config_summary: summary,
      notes:          notes || 'None'})
     .then(() => {
      if (email) {
        return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_email:       email,
            from_name:      name,
            config_summary: summary
        });
      }
    }).then(() => {
        status.className = 'status-msg success';
        status.textContent = '✓ Quote sent! We\'ll be in touch within 1 business day.';
        btn.textContent = 'Sent!';
        document.getElementById('f-name').value = '';
        document.getElementById('f-phone').value = '';
        document.getElementById('f-email').value = '';
        document.getElementById('f-notes').value = '';
    }).catch(err => {
        status.className = 'status-msg error';
        status.textContent = 'Something went wrong. Please email us directly.';
        btn.disabled = false;
        btn.textContent = 'Send Quote Request';
        console.error('EmailJS error:', err);
    });
}

// ── DOUBLE UNIT CANVAS PREVIEW ──
function drawPreviewDU() {
  const canvas = document.getElementById('cvs');
  const ctx = canvas.getContext('2d');
  const stainOn = S.addons.has('stain');
  const isBlack = stainOn && S.stainColor==='black';
  const isBrown = stainOn && S.stainColor==='brown';
  const isGreen = stainOn && S.stainColor==='green';
  const isGrey  = stainOn && S.stainColor==='grey';
  const hasCasters = S.addons.has('casters');
  const frameColor  = isBlack?'#252525':isBrown?'#5c3318':isGreen?'#2a4a2a':isGrey?'#444448':'#c8b08a';
  const frameAccent = '#C9A84C';
  const topPx  = 14;
  const castPx = hasCasters ? 14 : 0;
  const is4h   = S.doubleUnit === '4high';
  const is3h   = S.doubleUnit === '3high';
  const duRows = is4h ? 4 : is3h ? 3 : 2;

  const toteUnitPxW = WIDTH_IN[2] * SCALE_X;
  const toteUnitPxH = HEIGHT_IN[duRows] * SCALE_Y;
  const midRealW    = 133.5 - 2 * WIDTH_IN[2];
  const midPxW      = midRealW * SCALE_X;
  const totalPxW    = toteUnitPxW * 2 + midPxW;

  canvas.width  = Math.round(totalPxW + PAD*2);
  canvas.height = Math.round(toteUnitPxH + topPx + castPx + PAD*2);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const ox = PAD, oy = PAD + topPx;
  const cols = 2;
  const cellW = toteUnitPxW / cols;
  const cellH = toteUnitPxH / duRows;
  const ft = Math.max(3, Math.round(toteUnitPxW / (cols * 7)));

  const drawToteUnit = (startX) => {
    for(let c=0;c<=cols;c++){
      const x=startX+cellW*c;
      ctx.fillStyle=frameColor; ctx.fillRect(x-ft/2,oy,ft,toteUnitPxH);
      ctx.strokeStyle=frameAccent; ctx.lineWidth=0.7; ctx.strokeRect(x-ft/2,oy,ft,toteUnitPxH);
    }
    for(let r=0;r<=duRows;r++){
      const y=oy+cellH*r;
      ctx.fillStyle=frameColor; ctx.fillRect(startX,y-ft/2,toteUnitPxW,ft);
      ctx.strokeStyle=frameAccent; ctx.lineWidth=0.7; ctx.strokeRect(startX,y-ft/2,toteUnitPxW,ft);
    }
    for(let r=0;r<duRows;r++) for(let c=0;c<cols;c++){
      const bx=startX+c*cellW+ft/2+2, by=oy+r*cellH+ft/2+2;
      const bw=cellW-ft-4, bh=cellH-ft-4;
      if(bw<4||bh<4) continue;
      ctx.fillStyle='#222'; drawRoundRect(ctx, bx,by+bh*0.24,bw,bh*0.76,2); ctx.fill();
      ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=0.5; ctx.stroke();
      const lidH=Math.max(3,bh*0.17);
      ctx.fillStyle='#D4A017'; drawRoundRect(ctx, bx+bw*0.04,by+bh*0.13,bw*0.92,lidH,2); ctx.fill();
      ctx.strokeStyle='#A87C10'; ctx.lineWidth=0.4; ctx.stroke();
      if(bw>18){
        ctx.fillStyle='#A87C10';
        ctx.fillRect(bx+bw*0.13,by+bh*0.10,bw*0.1,bh*0.06);
        ctx.fillRect(bx+bw*0.77,by+bh*0.10,bw*0.1,bh*0.06);
      }
    }
  };

  const rightX = ox + toteUnitPxW + midPxW;
  drawToteUnit(ox);
  drawToteUnit(rightX);

  const mx = ox + toteUnitPxW;
  const shelfColor = isBlack?'#1e1e1e':isBrown?'#4a2810':isGreen?'#1a3a1a':isGrey?'#333336':'#b89c72';

  ctx.fillStyle=frameColor; ctx.fillRect(mx-ft/2,oy,ft,toteUnitPxH);
  ctx.strokeStyle=frameAccent; ctx.lineWidth=0.7; ctx.strokeRect(mx-ft/2,oy,ft,toteUnitPxH);
  ctx.fillStyle=frameColor; ctx.fillRect(mx+midPxW-ft/2,oy,ft,toteUnitPxH);
  ctx.strokeStyle=frameAccent; ctx.lineWidth=0.7; ctx.strokeRect(mx+midPxW-ft/2,oy,ft,toteUnitPxH);
  ctx.fillStyle=frameColor; ctx.fillRect(mx,oy-ft/2,midPxW,ft);
  ctx.strokeStyle=frameAccent; ctx.lineWidth=0.7; ctx.strokeRect(mx,oy-ft/2,midPxW,ft);
  ctx.fillStyle=frameColor; ctx.fillRect(mx,oy+toteUnitPxH-ft/2,midPxW,ft);
  ctx.strokeStyle=frameAccent; ctx.lineWidth=0.7; ctx.strokeRect(mx,oy+toteUnitPxH-ft/2,midPxW,ft);

  if (is4h) {
    const sy = oy + toteUnitPxH * 0.5;
    ctx.fillStyle=shelfColor; ctx.fillRect(mx,sy-3,midPxW,6);
    ctx.strokeStyle=frameAccent; ctx.lineWidth=0.6; ctx.strokeRect(mx,sy-3,midPxW,6);
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=0.5;
    for(let gi=1;gi<4;gi++){ctx.beginPath();ctx.moveTo(mx,sy-3+gi*1.5);ctx.lineTo(mx+midPxW,sy-3+gi*1.5);ctx.stroke();}
  } else if (is3h) {
    [1/3, 2/3].forEach(frac => {
      const sy = oy + toteUnitPxH * frac;
      ctx.fillStyle=shelfColor; ctx.fillRect(mx,sy-3,midPxW,6);
      ctx.strokeStyle=frameAccent; ctx.lineWidth=0.6; ctx.strokeRect(mx,sy-3,midPxW,6);
      ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=0.5;
      for(let gi=1;gi<4;gi++){ctx.beginPath();ctx.moveTo(mx,sy-3+gi*1.5);ctx.lineTo(mx+midPxW,sy-3+gi*1.5);ctx.stroke();}
    });
  }

  const tc = isBlack?'#1e1e1e':isBrown?'#4a2810':isGreen?'#1a3a1a':isGrey?'#333336':'#b89c72';
  ctx.fillStyle=tc; ctx.strokeStyle=frameAccent; ctx.lineWidth=0.8;
  ctx.fillRect(ox-4,oy-topPx,totalPxW+8,topPx-1);
  ctx.strokeRect(ox-4,oy-topPx,totalPxW+8,topPx-1);
  ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=0.5;
  for(let i=1;i<4;i++){const gy=oy-topPx+i*(topPx/4);ctx.beginPath();ctx.moveTo(ox-4,gy);ctx.lineTo(ox+totalPxW+4,gy);ctx.stroke();}

  if (hasCasters) {
    const botY = oy+toteUnitPxH;
    const frontWheelCount = casterCount(4, duRows) / 2;
    const pts = [];
    if (frontWheelCount > 1) {
        for(let i = 0; i < frontWheelCount; i++) {
            pts.push(ox + (totalPxW / (frontWheelCount - 1)) * i);
        }
    } else {
        pts.push(ox + totalPxW / 2);
    }
    pts.forEach(cx => {
      ctx.fillStyle='#555'; ctx.strokeStyle='#333'; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.ellipse(cx,botY+5,5,5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=frameAccent; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.ellipse(cx,botY+5,3,3,0,0,Math.PI*2); ctx.stroke();
    });
  }
}

// ── CANVAS PREVIEW ──
function drawPreview() {
  const canvas = document.getElementById('cvs');
  const ctx = canvas.getContext('2d');
  const {cols,rows,addons,stainColor} = S;
  const hasTop = addons.has('top') || addons.has('basictop'), hasCasters = addons.has('casters');
  const stainOn = addons.has('stain');
  const isBlack = stainOn && stainColor==='black';
  const isBrown = stainOn && stainColor==='brown';
  const isGreen = stainOn && stainColor==='green';
  const isGrey  = stainOn && stainColor==='grey';
  const wIn = WIDTH_IN[cols], hIn = HEIGHT_IN[rows];
  const topThickIn = addons.has('basictop') ? 0.5 : addons.has('top') ? 0.75 : 0;
  const unitPxW = wIn*SCALE_X, unitPxH = (hIn + topThickIn)*SCALE_Y;
  const topPx = hasTop ? 14 : 0, castPx = hasCasters ? 14 : 0;

  canvas.width  = Math.round(unitPxW + PAD*2);
  canvas.height = Math.round(unitPxH + topPx + castPx + PAD*2);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const ox = PAD, oy = PAD + topPx;
  const frameColor  = isBlack ? '#252525' : isBrown ? '#5c3318' : isGreen ? '#2a4a2a' : isGrey ? '#444448' : '#c8b08a';
  const frameAccent = '#C9A84C';
  const ft = Math.max(3, Math.round(unitPxW/(cols*7)));

  for (let c=0; c<=cols; c++) {
    const x = ox + (unitPxW/cols)*c;
    ctx.fillStyle = frameColor; ctx.fillRect(x-ft/2, oy, ft, unitPxH);
    ctx.strokeStyle = frameAccent; ctx.lineWidth = 0.7; ctx.strokeRect(x-ft/2, oy, ft, unitPxH);
  }
  for (let r=0; r<=rows; r++) {
    const y = oy + (unitPxH/rows)*r;
    ctx.fillStyle = frameColor; ctx.fillRect(ox, y-ft/2, unitPxW, ft);
    ctx.strokeStyle = frameAccent; ctx.lineWidth = 0.7; ctx.strokeRect(ox, y-ft/2, unitPxW, ft);
  }
  const cellW = unitPxW/cols, cellH = unitPxH/rows;
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      const bx = ox+c*cellW+ft/2+2, by = oy+r*cellH+ft/2+2;
      const bw = cellW-ft-4, bh = cellH-ft-4;
      if (bw<4||bh<4) continue;
      ctx.fillStyle='#222'; drawRoundRect(ctx, bx,by+bh*0.24,bw,bh*0.76,2); ctx.fill();
      ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=0.5; ctx.stroke();
      const lidH = Math.max(3,bh*0.17);
      ctx.fillStyle='#D4A017'; drawRoundRect(ctx, bx+bw*0.04,by+bh*0.13,bw*0.92,lidH,2); ctx.fill();
      ctx.strokeStyle='#A87C10'; ctx.lineWidth=0.4; ctx.stroke();
      if (bw>18) {
        ctx.fillStyle='#A87C10';
        ctx.fillRect(bx+bw*0.13,by+bh*0.10,bw*0.1,bh*0.06);
        ctx.fillRect(bx+bw*0.77,by+bh*0.10,bw*0.1,bh*0.06);
      }
    }
  }
  if (hasTop) {
    const tc = isBlack?'#1e1e1e':isBrown?'#4a2810':isGreen?'#1a3a1a':isGrey?'#333336':'#b89c72';
    ctx.fillStyle=tc; ctx.strokeStyle=frameAccent; ctx.lineWidth=0.8;
    ctx.fillRect(ox-4, oy-topPx, unitPxW+8, topPx-1);
    ctx.strokeRect(ox-4, oy-topPx, unitPxW+8, topPx-1);
    ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=0.5;
    for(let i=1;i<4;i++){const gy=oy-topPx+i*(topPx/4);ctx.beginPath();ctx.moveTo(ox-4,gy);ctx.lineTo(ox+unitPxW+4,gy);ctx.stroke();}
  }
  if (hasCasters) {
    const totalCount = casterCount(cols,rows);
    const frontCount = Math.ceil(totalCount / 2);
    const botY = oy+unitPxH;
    const pts = [];
    if (frontCount > 1) {
        for (let i=0; i<frontCount; i++) {
            pts.push(ox + (unitPxW / (frontCount - 1)) * i);
        }
    } else {
        pts.push(ox + unitPxW / 2);
    }
    pts.forEach(cx => {
      ctx.fillStyle='#555';
      ctx.strokeStyle='#333'; ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.ellipse(cx, botY+5, 5, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=frameAccent; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.ellipse(cx, botY+5, 3, 3, 0, 0, Math.PI*2); ctx.stroke();
    });
  }
}

// ── CONFIGURE FROM GALLERY ──
function configureFromGallery(cfg) {
  if (S.doubleUnit) toggleDoubleUnit(
    document.getElementById(S.doubleUnit==='4high'?'double-unit-btn':S.doubleUnit==='3high'?'double-unit-3h-btn':'double-unit-2h-btn'),
    S.doubleUnit
  );

  if (cfg.doubleUnit) {
    const duBtn = document.getElementById(cfg.doubleUnit==='4high'?'double-unit-btn':cfg.doubleUnit==='3high'?'double-unit-3h-btn':'double-unit-2h-btn');
    toggleDoubleUnit(duBtn, cfg.doubleUnit);
  } else {
    const colBtns = document.querySelectorAll('#cols-row .opt-btn:not(.opt-btn-du)');
    colBtns.forEach(b => {
      const v = parseInt(b.textContent);
      b.classList.toggle('sel', v === cfg.cols);
      if (v === cfg.cols) S.cols = cfg.cols;
    });
    const rowBtns = document.querySelectorAll('#rows-row .opt-btn');
    rowBtns.forEach(b => {
      const v = parseInt(b.textContent);
      b.classList.toggle('sel', v === cfg.rows);
      if (v === cfg.rows) S.rows = cfg.rows;
    });
  }

  S.addons.clear();
  document.querySelectorAll('.addon-card').forEach(c => c.classList.remove('on'));

  cfg.addons.forEach(key => {
    S.addons.add(key);
    const card = document.querySelector('.addon-card[data-key="'+key+'"]');
    if (card) card.classList.add('on');
  });

  update();
  document.getElementById('configurator').scrollIntoView({behavior:'smooth', block:'start'});
}

update();
</script>
